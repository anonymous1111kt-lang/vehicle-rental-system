{% extends "base.html" %}

{% block title %}Create Account - AutoRent{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5 bg-white">
                <div class="text-center mb-4">
                    <h3 class="fw-bold text-dark mb-1">Create an Account</h3>
                    <p class="text-muted small">Register to browse, rent, and manage your bookings</p>
                </div>

                <form method="POST" action="{{ url_for('register') }}">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label fw-semibold small">First Name *</label>
                            <input type="text" name="first_name" class="form-control" placeholder="John" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold small">Last Name *</label>
                            <input type="text" name="last_name" class="form-control" placeholder="Doe" required>
                        </div>

                        <div class="col-12">
                            <label class="form-label fw-semibold small">Email Address *</label>
                            <input type="email" name="email" class="form-control" placeholder="john@example.com" required>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-semibold small">Phone Number</label>
                            <input type="tel" name="phone" class="form-control" placeholder="555-123-4567">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-semibold small">Driver License Number *</label>
                            <input type="text" name="driver_license_number" class="form-control" placeholder="DL-12345678" required>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-semibold small">Password *</label>
                            <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-semibold small">Role</label>
                            <select name="role" class="form-select">
                                <option value="customer" selected>Customer</option>
                                <option value="staff">Staff</option>
                                <option value="admin">Admin</option>
                            </select>
                        </div>
                    </div>

                    <div class="mt-4">
                        <button type="submit" class="btn btn-primary w-100 rounded-pill py-2 fw-semibold shadow-sm mb-3">
                            Complete Registration <i class="bi bi-arrow-right ms-1"></i>
                        </button>
                    </div>
                </form>

                <div class="text-center mt-3">
                    <p class="text-muted small mb-0">Already have an account? 
                        <a href="{{ url_for('login') }}" class="text-primary fw-semibold text-decoration-none">Sign In</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
