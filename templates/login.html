{% extends "base.html" %}

{% block title %}Sign In - AutoRent{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5 bg-white">
                <div class="text-center mb-4">
                    <div class="brand-icon mx-auto mb-3" style="width: 52px; height: 52px; font-size: 1.5rem;">
                        <i class="bi bi-car-front-fill"></i>
                    </div>
                    <h3 class="fw-bold text-dark mb-1">Welcome Back</h3>
                    <p class="text-muted small">Access your bookings and account settings</p>
                </div>

                <form method="POST" action="{{ url_for('login') }}">
                    <div class="mb-3">
                        <label for="email" class="form-label fw-semibold small">Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-envelope text-muted"></i></span>
                            <input type="email" class="form-control" id="email" name="email" placeholder="name@example.com" required>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label fw-semibold small">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-key text-muted"></i></span>
                            <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 rounded-pill py-2 fw-semibold shadow-sm mb-3">
                        Sign In <i class="bi bi-box-arrow-in-right ms-1"></i>
                    </button>
                </form>

                <!-- Quick-Fill Demo Logins for Fast Testing -->
                <div class="p-3 bg-light rounded-3 mt-2 text-center">
                    <span class="text-muted small d-block mb-2 fw-semibold">Quick Demo Login Shortcuts:</span>
                    <div class="d-flex justify-content-center gap-2">
                        <button type="button" class="btn btn-outline-secondary btn-sm rounded-pill" onclick="fillCreds('admin@rental.com', 'admin123')">
                            <i class="bi bi-shield-lock me-1"></i> Admin
                        </button>
                        <button type="button" class="btn btn-outline-secondary btn-sm rounded-pill" onclick="fillCreds('john.doe@example.com', 'customer123')">
                            <i class="bi bi-person me-1"></i> Customer
                        </button>
                        <button type="button" class="btn btn-outline-secondary btn-sm rounded-pill" onclick="fillCreds('staff@rental.com', 'staff123')">
                            <i class="bi bi-person-badge me-1"></i> Staff
                        </button>
                    </div>
                </div>

                <div class="text-center mt-4">
                    <p class="text-muted small mb-0">Don't have an account? 
                        <a href="{{ url_for('register') }}" class="text-primary fw-semibold text-decoration-none">Register here</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    function fillCreds(email, password) {
        document.getElementById('email').value = email;
        document.getElementById('password').value = password;
    }
</script>
{% endblock %}
